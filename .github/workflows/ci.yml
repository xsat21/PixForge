name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait
      - name: Check HTTP, security policy, and static assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-delay 2 http://localhost:8080/healthz
          curl --fail http://localhost:8080/ -o /tmp/pixforge.html
          grep -q 'PixForge' /tmp/pixforge.html
          curl --fail -I http://localhost:8080/ | grep -i "connect-src 'none'"
          asset=$(grep -oE '/assets/[^" ]+\.js' /tmp/pixforge.html | head -n1)
          test -n "$asset"
          curl --fail "http://localhost:8080$asset" -o /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/)" = '403'
      - run: docker compose logs && docker compose down
        if: always()


services:
  pixforge:
    build:
      context: .
      dockerfile: Dockerfile

    image: pixforge:0.2.0

    # Akses LAN:
    # http://10.40.40.242:8081
    ports:
      - "10.40.40.242:8081:8080"

    restart: unless-stopped

    # Security hardening
    read_only: true

    tmpfs:
      - /tmp:size=16m,mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    init: true

    # Container health check
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
